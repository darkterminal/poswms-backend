name: Deploy to Staging

on:
  push:
    branches: [develop]

jobs:
  deploy:
    runs-on: ubuntu-latest

    environment:
      name: staging
      url: https://staging.mswms.example.com

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, pgsql, pdo_pgsql, bcmath, soap, intl

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress --optimize-autoloader --no-dev

      - name: Copy environment file
        run: cp .env.staging .env

      - name: Generate application key
        run: php artisan key:generate
        env:
          APP_KEY: ${{ secrets.STAGING_APP_KEY }}

      - name: Run migrations
        run: php artisan migrate --force
        env:
          DB_CONNECTION: pgsql
          DB_HOST: ${{ secrets.STAGING_DB_HOST }}
          DB_PORT: 5432
          DB_DATABASE: ${{ secrets.STAGING_DB_NAME }}
          DB_USERNAME: ${{ secrets.STAGING_DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.STAGING_DB_PASSWORD }}

      - name: Clear and cache configuration
        run: |
          php artisan config:cache
          php artisan route:cache
          php artisan view:cache

      - name: Set permissions
        run: |
          chmod -R 775 storage/
          chmod -R 775 bootstrap/cache/

      - name: Restart queue workers
        run: php artisan queue:restart

      - name: Deployment notification
        run: |
          echo "✅ Staging deployment completed successfully!"
          echo "🌐 URL: https://staging.mswms.example.com"
          echo "📦 Commit: ${{ github.sha }}"
