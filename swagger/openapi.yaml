          type: string
          description: 3-letter ISO currency code
        status:
          type: string
          enum: [active, suspended, archived]
        subscription_plan:
          type: string
          enum: [starter, professional, enterprise]
        trial_ends_at:
          type: string
          format: date-time
        subscription_ends_at:
          type: string
          format: date-time
        settings:
          type: object
          description: Tenant configuration settings
          properties:
            # Appearance
            theme:
              type: string
              enum: [light, dark, system]
              default: system
              description: Application color theme
            sidebar_collapsed:
              type: boolean
              default: false
              description: Start with sidebar collapsed
            # Notifications
            email_notifications:
              type: boolean
              default: true
              description: Send email updates
            low_stock_notifications:
              type: boolean
              default: true
              description: Notify when stock is low
            order_notifications:
              type: boolean
              default: true
              description: New order notifications
            # Inventory
            low_stock_threshold:
              type: integer
              minimum: 1
              maximum: 1000
              default: 20
              description: Alert when stock falls below this level
            track_inventory:
              type: boolean
              default: true
              description: Enable stock tracking
            allow_negative_stock:
              type: boolean
              default: false
              description: Sell beyond available stock
            # Sales
            enable_receipt_printing:
              type: boolean
              default: true
              description: Auto-print receipts
            default_tax_rate:
              type: number
              minimum: 0
              maximum: 100
              default: 0
              description: Tax rate applied to all sales
            enable_discounts:
              type: boolean
              default: true
              description: Allow discount application
            # POS
            pos_mode:
              type: string
              enum: [quick, standard, detailed]
              default: standard
              description: Point of sale interface mode
            enable_barcodes:
              type: boolean
              default: true
              description: Enable barcode support
            # Advanced
            data_retention_days:
              type: integer
              minimum: 30
              maximum: 3650
              default: 365
              description: Keep data for this many days
            enable_audit_log:
              type: boolean
              default: true
              description: Track all user actions
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

