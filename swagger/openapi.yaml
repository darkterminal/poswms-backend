paths:
  /api/v1/health:
    get:
      tags:
        - Super Admin
      summary: Health check
      description: Check API health status. This endpoint does not require authentication.
      operationId: healthCheck
      responses:
        '200':
          description: API is healthy
          headers:
            X-RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    examples:
                      - value: true
                  message:
                    type: string
                    examples:
                      - value: "API is healthy"
                  data:
                    type: object
                    properties:
                      status:
                        type: string
                        examples:
                          - value: "ok"
                      timestamp:
                        type: string
                        format: date-time
                      environment:
                        type: string
                        examples:
                          - value: "local"
                      version:
                        type: string
                        examples:
                          - value: "1.0.0"

  /api/v1/auth/login:
    post:
      tags:
        - Authentication
      summary: Login user
      description: Authenticate user and receive access token
      operationId: loginUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                password:
                  type: string
              required:
                - email
                - password
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          description: Authentication failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/tenants/{tenant_id}/auth/logout:
    post:
      tags:
        - Authentication
      summary: Logout user
      description: Revoke the current authentication token
      operationId: logoutUser
      parameters:
        - $ref: '#/components/parameters/TenantId'
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Logout successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/tenants/{tenant_id}/auth/refresh:
    post:
