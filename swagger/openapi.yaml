components:
  parameters:
    TenantId:
      in: path
      name: tenant_id
      required: true
      schema:
        type: integer
      description: Tenant identifier

  headers:
    RateLimitLimit:
      description: The maximum number of requests allowed per time window
      schema:
        type: integer
      example: 60
    RateLimitRemaining:
      description: The number of requests remaining in the current time window
      schema:
        type: integer
      example: 45
    RateLimitReset:
      description: The time at which the rate limit window resets (Unix timestamp)
      schema:
        type: integer
      example: 1704067200
    RetryAfter:
      description: The number of seconds to wait before retrying (only present when rate limited)
      schema:
        type: integer
      example: 60
    PaginationTotal:
      description: Total number of items available
      schema:
        type: integer
      example: 100
    PaginationPerPage:
      description: Number of items per page
      schema:
        type: integer
      example: 15
    PaginationCurrentPage:
      description: Current page number
      schema:
        type: integer
      example: 1
    PaginationLastPage:
      description: Last page number
      schema:
        type: integer
      example: 7

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Bearer token authentication using Laravel Sanctum. Token should be obtained via /api/v1/auth/login endpoint.

  schemas:
    SuccessResponse:
      type: object
      properties:
        success:
          type: boolean
          examples:
            - value: true
        message:
          type: string
          examples:
            - value: "Operation completed successfully"

    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          examples:
            - value: false
        error:
          type: object
          properties:
            code:
              type: string
              examples:
                - value: "UNAUTHORIZED"
            message:
              type: string
              examples:
                - value: "Invalid credentials provided"
            details:
              type: object
              additionalProperties: true
              examples:
                - value: {"field": "value"}
        meta:
          type: object
          properties:
            timestamp:
              type: string
              format: date-time
              examples:
                - value: "2024-01-01T00:00:00Z"
            path:
              type: string
              examples:
                - value: "/api/v1/tenants/1/products"
            request_id:
              type: string
              examples:
                - value: "abc123-def456"

    UnauthorizedError:
      description: Authentication information was missing or invalid
      type: object
      properties:
        success:
          type: boolean
          examples:
            - value: false
        error:
          type: object
          properties:
            code:
              type: string
              examples:
                - value: "UNAUTHORIZED"
            message:
              type: string
              examples:
                - value: "Authentication required"
        meta:
          type: object
          properties:
            timestamp:
              type: string
              format: date-time

    ForbiddenError:
      description: User does not have permission to access this resource
      type: object
      properties:
        success:
          type: boolean
          examples:
            - value: false
        error:
          type: object
          properties:
            code:
              type: string
              examples:
                - value: "FORBIDDEN"
            message:
              type: string
              examples:
                - value: "You do not have permission to access this resource"
        meta:
          type: object
          properties:
            timestamp:
              type: string
              format: date-time

    NotFoundError:
      description: The specified resource was not found
      type: object
      properties:
        success:
          type: boolean
          examples:
            - value: false
        error:
          type: object
          properties:
            code:
              type: string
              examples:
                - value: "NOT_FOUND"
            message:
              type: string
              examples:
                - value: "Resource not found"
        meta:
          type: object
          properties:
            timestamp:
              type: string
              format: date-time

    ValidationError:
      type: object
      description: Laravel validation error response
      properties:
        success:
          type: boolean
          examples:
            - value: false
        error:
          type: object
          properties:
            code:
              type: string
              examples:
                - value: "VALIDATION_ERROR"
            message:
              type: string
              examples:
                - value: "The given data was invalid."
        errors:
          type: object
          description: Field-specific validation errors
          additionalProperties:
            type: array
            items:
              type: string
            description: Array of error messages for the field
          examples:
            - value:
                email:
                  - "The email field is required."
                password:
                  - "The password must be at least 8 characters."

    RateLimitError:
      description: Too many requests have been made in a short time period
      type: object
      properties:
        success:
          type: boolean
          examples:
            - value: false
        error:
          type: object
          properties:
            code:
              type: string
              examples:
                - value: "TOO_MANY_REQUESTS"
            message:
              type: string
              examples:
                - value: "Rate limit exceeded. Please try again later."
        meta:
          type: object
          properties:
            timestamp:
              type: string
              format: date-time
            retry_after:
              type: integer
              description: Seconds to wait before retrying
              examples:
                - value: 60

    ServerError:
      description: An unexpected error occurred on the server
      type: object
      properties:
        success:
          type: boolean
          examples:
            - value: false
        error:
          type: object
          properties:
            code:
              type: string
              examples:
                - value: "INTERNAL_SERVER_ERROR"
            message:
              type: string
              examples:
                - value: "An unexpected error occurred. Please try again later."
        meta:
          type: object
          properties:
            timestamp:
              type: string
              format: date-time
            request_id:
              type: string
              description: Unique identifier for this request (useful for support)


    User:
      type: object
      properties:
        id:
          type: integer
        tenant_id:
          type: integer
        name:
