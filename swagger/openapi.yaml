openapi: 3.1.0
info:
  title: POS WMS Backend API
  description: Point of Sale & Warehouse Management System API
  version: 1.0.0
  contact:
    name: API Support
    email: support@example.com
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT

servers:
  - url: https://api.example.com
    description: Production server
  - url: http://localhost:8000
    description: Development server

tags:
  - name: Authentication
    description: User authentication and authorization
  - name: Stores
    description: Store management endpoints
  - name: Warehouses
    description: Warehouse management endpoints
  - name: Products
    description: Product management endpoints
  - name: Categories
    description: Category management endpoints
  - name: Inventory
    description: Inventory management endpoints
  - name: Orders
    description: Order management endpoints
  - name: Customers
    description: Customer management endpoints
  - name: Pricing
    description: Pricing and pricing tiers management
  - name: Roles & Permissions
    description: Role and permission management
  - name: Reports & Dashboard
    description: Dashboard and reporting endpoints
  - name: Webhooks
    description: Webhook management and audit logs

paths:
  /api/v1/auth/login:
    post:
      tags:
        - Authentication
      summary: Login user
      description: Authenticate user and receive access token
      operationId: loginUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
                  examples:
                    - value: user@example.com
                password:
                  type: string
                  format: password
                  examples:
                    - value: password123
              required:
                - email
                - password
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          description: Authentication failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/tenants/{tenant_id}/auth/logout:
    post:
      tags:
        - Authentication
      summary: Logout user
      description: Revoke the current authentication token
      operationId: logoutUser
      parameters:
        - $ref: '#/components/parameters/TenantId'
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Logout successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/tenants/{tenant_id}/auth/refresh:
    post:
      tags:
        - Authentication
      summary: Refresh token
      description: Revoke current token and issue a new one
      operationId: refreshToken
      parameters:
        - $ref: '#/components/parameters/TenantId'
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Token refreshed successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      token:
                        type: string
                      token_type:
                        type: string
                  message:
                    type: string

  /api/v1/tenants/{tenant_id}/auth/me:
    get:
      tags:
        - Authentication
      summary: Get current user
      description: Retrieve authenticated user details
      operationId: getCurrentUser
      parameters:
        - $ref: '#/components/parameters/TenantId'
      security:
        - bearerAuth: []
      responses:
        '200':
          description: User retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      user:
