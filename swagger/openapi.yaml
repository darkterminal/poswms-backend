openapi: 3.1.0
info:
  title: POS WMS Backend API
  description: |
    Point of Sale & Warehouse Management System API

    ## Authentication
    This API uses Bearer token authentication with Laravel Sanctum. Include the token in the Authorization header:
    ```
    Authorization: Bearer {your-token}
    ```

    ## Authorization
    Some endpoints require specific user roles. These are marked with the `x-role` extension:
    - `x-role: [admin]` - Requires user to have the 'admin' role
    - `x-role: [admin, manager]` - Requires user to have either 'admin' OR 'manager' role

    Similarly, endpoints requiring specific permissions are marked with `x-permission`:
    - `x-permission: [products.create, products.edit]` - Requires user to have at least one of the specified permissions

    ## Multi-Tenancy
    Most endpoints are scoped to a tenant. The `tenant_id` path parameter identifies the tenant context.
    Users must have access to the specified tenant to perform operations.

    ## Rate Limiting
    API requests are rate limited to ensure fair usage. Default limits:
    - **Authenticated requests**: 60 requests per minute
    - **Unauthenticated requests**: 30 requests per minute
    
    Rate limit headers are included in responses:
    - `X-RateLimit-Limit`: Maximum requests allowed
    - `X-RateLimit-Remaining`: Requests remaining
    - `Retry-After`: Seconds to wait before retrying (when rate limited)

    ## Error Handling
    All errors follow a consistent format with HTTP status codes:
    - `400 Bad Request`: Invalid request syntax or parameters
    - `401 Unauthorized`: Missing or invalid authentication
    - `403 Forbidden`: Insufficient permissions
    - `404 Not Found`: Resource not found
    - `422 Unprocessable Entity`: Validation errors
    - `429 Too Many Requests`: Rate limit exceeded
    - `500 Internal Server Error`: Server error
