                - email
              properties:
                name:
                  type: string
                  maxLength: 255
                slug:
                  type: string
                  maxLength: 255
                  description: Unique slug identifier for the tenant
                email:
                  type: string
                  format: email
                company_name:
                  type: string
                  maxLength: 255
                phone:
                  type: string
                  maxLength: 50
                address:
                  type: string
                  maxLength: 500
                city:
                  type: string
                  maxLength: 255
                state:
                  type: string
                  maxLength: 255
                country:
                  type: string
                  maxLength: 255
                postal_code:
                  type: string
                  maxLength: 20
                timezone:
                  type: string
                  maxLength: 50
                currency:
                  type: string
                  maxLength: 3
                status:
                  type: string
                  enum: [active, suspended, inactive]
                subscription_plan:
                  type: string
                  enum: [starter, professional, enterprise]
