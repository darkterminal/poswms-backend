      operationId: getStore
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - in: path
          name: storeId
          required: true
          schema:
            type: integer
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Store retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      store:
                        $ref: '#/components/schemas/Store'

    put:
      tags:
        - Stores
      summary: Update store
      description: Update an existing store
      operationId: updateStore
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - in: path
          name: storeId
          required: true
          schema:
            type: integer
      security:
        - bearerAuth: []
      requestBody:
        required: true
