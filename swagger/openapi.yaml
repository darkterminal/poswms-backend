components:
  parameters:
    TenantId:
      in: path
      name: tenant_id
      required: true
      schema:
        type: integer
      description: Tenant identifier

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Bearer token authentication using Laravel Sanctum

  schemas:
    SuccessResponse:
      type: object
      properties:
        success:
          type: boolean
          examples:
            - value: true
        message:
          type: string

    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          examples:
            - value: false
        error:
          type: object
          properties:
            code:
              type: string
            message:
              type: string
            details:
              type: object
              additionalProperties: true
        meta:
          type: object
          properties:
            timestamp:
              type: string
              format: date-time

    User:
      type: object
      properties:
        id:
          type: integer
        tenant_id:
          type: integer
        name:
          type: string
        email:
          type: string
          format: email
        role:
          type: string
        store_id:
          type: integer
        warehouse_id:
          type: integer
        is_active:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    LoginResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: object
          properties:
            user:
              $ref: '#/components/schemas/User'
            token:
              type: string
            token_type:
              type: string
        message:
          type: string

