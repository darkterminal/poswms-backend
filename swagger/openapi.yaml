  /api/v1/admin/tenants:
    get:
      tags:
        - Super Admin
      summary: List all tenants
      description: Get paginated list of all tenants with optional filtering
      operationId: listTenants
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            default: 1
          description: Page number
        - in: query
          name: per_page
          schema:
            type: integer
            default: 15
          description: Items per page
        - in: query
          name: search
          schema:
            type: string
          description: Search by name, slug, company name, or email
        - in: query
          name: status
          schema:
            type: string
            enum: [active, suspended, archived]
          description: Filter by status
        - in: query
          name: plan
          schema:
            type: string
            enum: [starter, professional, enterprise]
          description: Filter by subscription plan
        - in: query
          name: trial_expiring
          schema:
            type: string
            enum: [24hours, 7days, 30days, expired]
          description: Filter by trial expiry timeframe
        - in: query
          name: subscription_status
          schema:
            type: string
            enum: [active, expiring, expired, none]
          description: "Filter by subscription status (active: has active subscription, expiring: expires in 30 days, expired: already expired, none: no subscription)"
        - in: query
          name: date_from
          schema:
            type: string
            format: date
          description: Filter by created date from (YYYY-MM-DD)
        - in: query
          name: date_to
          schema:
            type: string
            format: date
          description: Filter by created date to (YYYY-MM-DD)
        - in: query
          name: sort_by
          schema:
            type: string
            default: created_at
          description: "Sort field (allowed: name, slug, company_name, email, status, subscription_plan, trial_ends_at, subscription_ends_at, created_at, updated_at)"
        - in: query
          name: sort_direction
          schema:
            type: string
            enum: [asc, desc]
            default: desc
          description: Sort direction
      responses:
        '200':
          description: List of tenants
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      tenants:
                        type: array
                        items:
                          $ref: '#/components/schemas/Tenant'
                      pagination:
                        type: object
                        properties:
                          current_page:
                            type: integer
                          per_page:
                            type: integer
                          total:
                            type: integer
                          last_page:
                            type: integer
                          has_more:
                            type: boolean
                  message:
                    type: string
    post:
      tags:
        - Super Admin
