openapi: 3.1.0
info:
  title: Multi-Store & Warehouse Management System API
  description: |
    A comprehensive SaaS platform for managing multiple retail locations and warehouses.
    ## Authentication
    All API requests (except login) require authentication via Laravel Sanctum Bearer tokens.
    Include the token in the Authorization header:
    ```
    Authorization: Bearer {your-token}
    ```
    ## Multi-Tenancy
    All authenticated endpoints are scoped by tenant ID. Include the tenant ID in the URL path:
    ```
    /api/v1/tenants/{tenant_id}/...
    ```
    ## Rate Limiting
    - Standard API requests: 60 requests/minute
    - Admin endpoints: 120 requests/minute
    - Authentication endpoints: 10 requests/minute
    ## Response Format
    All responses follow a consistent JSON structure:
    ```json
    {
      "success": true,
      "data": { ... },
      "message": "Optional message",
      "meta": { ... }
    }
    ```
  version: 1.0.0
  contact:
    name: API Support
    email: support@poswms.com
servers:
  - url: https://api.poswms.com/api/v1
    description: Production server
  - url: http://localhost:8000/api/v1
    description: Local development server
tags:
  - name: Authentication
    description: User authentication and token management
  - name: Tenants
    description: Multi-tenant organization management
  - name: Users
    description: User account management
  - name: Roles & Permissions
    description: Role-based access control
  - name: Stores
    description: Retail store locations
  - name: Warehouses
    description: Warehouse and storage facilities
  - name: Products
    description: Product catalog management
  - name: Categories
    description: Product categorization
  - name: Customers
    description: Customer management
  - name: Inventory
    description: Stock tracking and management
  - name: Orders
    description: Order processing and fulfillment
  - name: Pricing
    description: Multi-level pricing tiers and rules
  - name: Reports
    description: Sales and inventory reporting
  - name: Dashboard
    description: Unified metrics and KPIs
  - name: Webhooks
    description: External system integrations
  - name: Audit Logs
    description: Activity tracking and compliance
security:
  - sanctum: []
paths:
  # ==================== Authentication ====================
  /auth/login:
    post:
      tags:
        - Authentication
      summary: User Login
      description: Authenticate user and receive access token
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                  format: password
      responses:
        '200':
          description: Successful login
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /auth/logout:
    post:
      tags:
        - Authentication
      summary: User Logout
      description: Invalidate current access token
      operationId: logout
      responses:
        '200':
          description: Successfully logged out
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
  /auth/refresh:
    post:
      tags:
        - Authentication
      summary: Refresh Token
      description: Generate a new access token
      operationId: refreshToken
      responses:
        '200':
          description: Token refreshed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
  /auth/me:
    get:
      tags:
        - Authentication
      summary: Get Current User
      description: Retrieve authenticated user information
      operationId: getCurrentUser
      responses:
        '200':
          description: User information
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/User'
  # ==================== Roles & Permissions ====================
  /tenants/{tenant_id}/roles:
    get:
      tags:
        - Roles & Permissions
      summary: List Roles
      description: Get all roles for the tenant
      operationId: listRoles
      parameters:
        - $ref: '#/components/parameters/TenantId'
      responses:
        '200':
          description: List of roles
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Role'
    post:
      tags:
        - Roles & Permissions
      summary: Create Role
      description: Create a new role
      operationId: createRole
      parameters:
        - $ref: '#/components/parameters/TenantId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - slug
              properties:
                name:
                  type: string
                slug:
                  type: string
                description:
                  type: string
                permissions:
                  type: array
                  items:
                    type: string
      responses:
        '201':
          description: Role created
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/Role'
  /tenants/{tenant_id}/roles/{roleId}:
    get:
      tags:
        - Roles & Permissions
      summary: Get Role
      description: Get a specific role
      operationId: getRole
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/RoleId'
      responses:
        '200':
          description: Role details
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/Role'
    put:
      tags:
        - Roles & Permissions
      summary: Update Role
      description: Update a role
      operationId: updateRole
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/RoleId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                description:
                  type: string
                permissions:
                  type: array
                  items:
                    type: string
      responses:
        '200':
          description: Role updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/Role'
    delete:
      tags:
        - Roles & Permissions
      summary: Delete Role
      description: Delete a role
      operationId: deleteRole
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/RoleId'
      responses:
        '200':
          description: Role deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
  /tenants/{tenant_id}/permissions:
    get:
      tags:
        - Roles & Permissions
      summary: List Permissions
      description: Get all available permissions
      operationId: listPermissions
      parameters:
        - $ref: '#/components/parameters/TenantId'
      responses:
        '200':
          description: List of permissions
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Permission'
  # ==================== Stores ====================
  /tenants/{tenant_id}/stores:
    get:
      tags:
        - Stores
      summary: List Stores
      description: Get all stores for the tenant
      operationId: listStores
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/Pagination'
      responses:
        '200':
          description: List of stores
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Store'
                  meta:
                    $ref: '#/components/schemas/PaginationMeta'
    post:
      tags:
        - Stores
      summary: Create Store
      description: Create a new store
      operationId: createStore
      parameters:
        - $ref: '#/components/parameters/TenantId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
              properties:
                name:
                  type: string
                code:
                  type: string
                email:
                  type: string
                  format: email
                phone:
                  type: string
                address:
                  type: string
                city:
                  type: string
                state:
                  type: string
                country:
                  type: string
                postal_code:
                  type: string
                is_active:
                  type: boolean
                  default: true
      responses:
        '201':
          description: Store created
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  data:
                    $ref: '#/components/schemas/Store'
  /tenants/{tenant_id}/stores/{storeId}:
    get:
      tags:
        - Stores
      summary: Get Store
      description: Get a specific store
      operationId: getStore
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/StoreId'
      responses:
        '200':
          description: Store details
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/Store'
    put:
      tags:
        - Stores
      summary: Update Store
      description: Update a store
      operationId: updateStore
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/StoreId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                code:
                  type: string
                email:
                  type: string
                phone:
                  type: string
                address:
                  type: string
                city:
                  type: string
                state:
                  type: string
                country:
                  type: string
                postal_code:
                  type: string
                is_active:
                  type: boolean
      responses:
        '200':
          description: Store updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  data:
                    $ref: '#/components/schemas/Store'
    delete:
      tags:
        - Stores
      summary: Delete Store
      description: Delete a store
      operationId: deleteStore
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/StoreId'
      responses:
        '200':
          description: Store deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
  # ==================== Warehouses ====================
  /tenants/{tenant_id}/warehouses:
    get:
      tags:
        - Warehouses
      summary: List Warehouses
      description: Get all warehouses for the tenant
      operationId: listWarehouses
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/Pagination'
      responses:
        '200':
          description: List of warehouses
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Warehouse'
                  meta:
                    $ref: '#/components/schemas/PaginationMeta'
    post:
      tags:
        - Warehouses
      summary: Create Warehouse
      description: Create a new warehouse
      operationId: createWarehouse
      parameters:
        - $ref: '#/components/parameters/TenantId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
              properties:
                name:
                  type: string
                code:
                  type: string
                email:
                  type: string
                phone:
                  type: string
                address:
                  type: string
                city:
                  type: string
                state:
                  type: string
                country:
                  type: string
                postal_code:
                  type: string
                is_active:
                  type: boolean
                  default: true
      responses:
        '201':
          description: Warehouse created
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  data:
                    $ref: '#/components/schemas/Warehouse'
  /tenants/{tenant_id}/warehouses/{warehouseId}:
    get:
      tags:
        - Warehouses
      summary: Get Warehouse
      description: Get a specific warehouse
      operationId: getWarehouse
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/WarehouseId'
      responses:
        '200':
          description: Warehouse details
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/Warehouse'
    put:
      tags:
        - Warehouses
      summary: Update Warehouse
      description: Update a warehouse
      operationId: updateWarehouse
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/WarehouseId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                code:
                  type: string
                email:
                  type: string
                phone:
                  type: string
                address:
                  type: string
                city:
                  type: string
                state:
                  type: string
                country:
                  type: string
                postal_code:
                  type: string
                is_active:
                  type: boolean
      responses:
        '200':
          description: Warehouse updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  data:
                    $ref: '#/components/schemas/Warehouse'
    delete:
      tags:
        - Warehouses
      summary: Delete Warehouse
      description: Delete a warehouse
      operationId: deleteWarehouse
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/WarehouseId'
      responses:
        '200':
          description: Warehouse deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
  # ==================== Products ====================
  /tenants/{tenant_id}/products:
    get:
      tags:
        - Products
      summary: List Products
      description: Get all products for the tenant
      operationId: listProducts
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/Pagination'
        - name: category_id
          in: query
          schema:
            type: integer
          description: Filter by category
        - name: search
          in: query
          schema:
            type: string
          description: Search by name or SKU
      responses:
        '200':
          description: List of products
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: array
                    items:
                      - $ref: '#/components/schemas/Product'
                      - $ref: '#/components/schemas/PaginationMeta'
    post:
      tags:
        - Products
      summary: Create Product
      description: Create a new product
      operationId: createProduct
      parameters:
        - $ref: '#/components/parameters/TenantId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - sku
              properties:
                name:
                  type: string
                sku:
                  type: string
                description:
                  type: string
                category_id:
                  type: integer
                base_price:
                  type: number
                  format: float
                cost_price:
                  type: number
                  format: float
                min_stock_level:
                  type: integer
                is_active:
                  type: boolean
                  default: true
      responses:
        '201':
          description: Product created
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  data:
                    $ref: '#/components/schemas/Product'
  /tenants/{tenant_id}/products/{productId}:
    get:
      tags:
        - Products
      summary: Get Product
      description: Get a specific product
      operationId: getProduct
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/ProductId'
      responses:
        '200':
          description: Product details
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/Product'
    put:
      tags:
        - Products
      summary: Update Product
      description: Update a product
      operationId: updateProduct
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/ProductId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                sku:
                  type: string
                description:
                  type: string
                category_id:
                  type: integer
                base_price:
                  type: number
                cost_price:
                  type: number
                min_stock_level:
                  type: integer
                is_active:
                  type: boolean
      responses:
        '200':
          description: Product updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  data:
                    $ref: '#/components/schemas/Product'
    delete:
      tags:
        - Products
      summary: Delete Product
      description: Delete a product
      operationId: deleteProduct
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/ProductId'
      responses:
        '200':
          description: Product deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
  # ==================== Inventory ====================
  /tenants/{tenant_id}/inventory:
    get:
      tags:
        - Inventory
      summary: List Inventory
      description: Get inventory levels
      operationId: listInventory
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/Pagination'
        - name: product_id
          in: query
          schema:
            type: integer
          description: Filter by product
        - name: warehouse_id
          in: query
          schema:
            type: integer
          description: Filter by warehouse
        - name: store_id
          in: query
          schema:
            type: integer
          description: Filter by store
      responses:
        '200':
          description: Inventory levels
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Inventory'
                  meta:
                    $ref: '#/components/schemas/PaginationMeta'
  /tenants/{tenant_id}/inventory/transfer:
    post:
      tags:
        - Inventory
      summary: Transfer Stock
      description: Transfer stock between locations
      operationId: transferStock
      parameters:
        - $ref: '#/components/parameters/TenantId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - product_id
                - from_location_type
                - from_location_id
                - to_location_type
                - to_location_id
                - quantity
              properties:
                product_id:
                  type: integer
                from_location_type:
                  type: string
                  enum: [warehouse, store]
                from_location_id:
                  type: integer
                to_location_type:
                  type: string
                  enum: [warehouse, store]
                to_location_id:
                  type: integer
                quantity:
                  type: integer
                notes:
                  type: string
      responses:
        '200':
          description: Stock transferred
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  data:
                    $ref: '#/components/schemas/StockMovement'
  # ==================== Orders ====================
  /tenants/{tenant_id}/orders:
    get:
      tags:
        - Orders
      summary: List Orders
      description: Get all orders
      operationId: listOrders
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/Pagination'
        - name: status
          in: query
          schema:
            type: string
            enum: [pending, confirmed, fulfilling, completed, cancelled]
          description: Filter by status
        - name: customer_id
          in: query
          schema:
            type: integer
          description: Filter by customer
      responses:
        '200':
          description: List of orders
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Order'
                  meta:
                    $ref: '#/components/schemas/PaginationMeta'
    post:
      tags:
        - Orders
      summary: Create Order
      description: Create a new order
      operationId: createOrder
      parameters:
        - $ref: '#/components/parameters/TenantId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - customer_id
                - items
              properties:
                customer_id:
                  type: integer
                order_date:
                  type: string
                  format: date-time
                notes:
                  type: string
                items:
                  type: array
                  items:
                    type: object
                    required:
                      - product_id
                      - quantity
                    properties:
                      product_id:
                        type: integer
                      quantity:
                        type: integer
                      unit_price:
                        type: number
      responses:
        '201':
          description: Order created
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  data:
                    $ref: '#/components/schemas/Order'
  /tenants/{tenant_id}/orders/{orderId}:
    get:
      tags:
        - Orders
      summary: Get Order
      description: Get a specific order
      operationId: getOrder
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/OrderId'
      responses:
        '200':
          description: Order details
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/Order'
  /tenants/{tenant_id}/orders/{orderId}/fulfill:
    post:
      tags:
        - Orders
      summary: Fulfill Order
      description: Process order fulfillment
      operationId: fulfillOrder
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/OrderId'
      responses:
        '200':
          description: Order fulfilled
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  data:
                    $ref: '#/components/schemas/Order'
  /tenants/{tenant_id}/orders/{orderId}/cancel:
    post:
      tags:
        - Orders
      summary: Cancel Order
      description: Cancel an order
      operationId: cancelOrder
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/OrderId'
      responses:
        '200':
          description: Order cancelled
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  data:
                    $ref: '#/components/schemas/Order'
  # ==================== Pricing ====================
  /tenants/{tenant_id}/pricing-tiers:
    get:
      tags:
        - Pricing
      summary: List Pricing Tiers
      description: Get all pricing tiers
      operationId: listPricingTiers
      parameters:
        - $ref: '#/components/parameters/TenantId'
      responses:
        '200':
          description: List of pricing tiers
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/PricingTier'
    post:
      tags:
        - Pricing
      summary: Create Pricing Tier
      description: Create a new pricing tier
      operationId: createPricingTier
      parameters:
