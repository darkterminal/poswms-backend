components:
  securitySchemes:
    sanctum:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Laravel Sanctum API token
  parameters:
    TenantId:
      name: tenant_id
      in: path
      required: true
      schema:
        type: integer
      description: Tenant ID for multi-tenant scoping
    StoreId:
      name: storeId
      in: path
      required: true
      schema:
        type: integer
    WarehouseId:
      name: warehouseId
      in: path
      required: true
      schema:
        type: integer
    ProductId:
      name: productId
      in: path
      required: true
      schema:
        type: integer
    OrderId:
      name: orderId
      in: path
      required: true
      schema:
        type: integer
    RoleId:
      name: roleId
      in: path
      required: true
      schema:
        type: integer
    WebhookId:
      name: webhookId
      in: path
      required: true
      schema:
        type: integer
    AuditLogId:
      name: auditLogId
      in: path
      required: true
      schema:
        type: integer
    Pagination:
      name: page
      in: query
      schema:
        type: integer
        default: 1
      description: Page number
    PerPage:
      name: per_page
      in: query
      schema:
        type: integer
        default: 20
      description: Items per page
  schemas:
    # ==================== Auth ====================
    AuthResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: object
          properties:
            token:
              type: string
            token_type:
              type: string
              examples: ["Bearer"] # Changed from 'example: Bearer' to 'examples: ["Bearer"]'
            expires_in:
              type: integer
    # ==================== Users & Roles ====================
    User:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        email:
          type: string
          format: email
        role:
          type: string
        tenant_id:
          type: integer
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    Role:
      type: object
      properties:
        id:
          type: integer
        tenant_id:
          type: integer
        name:
          type: string
        slug:
          type: string
        description:
          type: string
        permissions:
          type: array
          items:
            type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    Permission:
      type: object
      properties:
        id:
          type: integer
        tenant_id:
          type: integer
        name:
          type: string
        slug:
          type: string
        created_at:
          type: string
          format: date-time
    # ==================== Entities ====================
    Store:
      type: object
      properties:
        id:
          type: integer
        tenant_id:
          type: integer
        name:
          type: string
        code:
          type: string
        email:
          type: string
        phone:
          type: string
        address:
          type: string
        city:
          type: string
        state:
          type: string
        country:
          type: string
        postal_code:
          type: string
        is_active:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    Warehouse:
      type: object
      properties:
        id:
          type: integer
        tenant_id:
          type: integer
        name:
          type: string
        code:
          type: string
        email:
          type: string
        phone:
          type: string
        address:
          type: string
        city:
          type: string
        state:
          type: string
        country:
          type: string
        postal_code:
          type: string
        is_active:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    Product:
      type: object
      properties:
        id:
          type: integer
        tenant_id:
          type: integer
        name:
          type: string
        sku:
          type: string
        description:
          type: string
        category_id:
          type: integer
        base_price:
          type: number
        cost_price:
          type: number
        min_stock_level:
          type: integer
        is_active:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    Customer:
      type: object
      properties:
        id:
          type: integer
        tenant_id:
          type: integer
        name:
          type: string
        email:
          type: string
        phone:
          type: string
        pricing_tier_id:
          type: integer
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    Inventory:
      type: object
      properties:
        id:
          type: integer
        tenant_id:
          type: integer
        product_id:
          type: integer
        location_type:
          type: string
          enum: [warehouse, store]
        location_id:
          type: integer
        quantity:
          type: integer
        reserved_quantity:
          type: integer
        available_quantity:
          type: integer
        min_stock_level:
          type: integer
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    StockMovement:
      type: object
      properties:
        id:
          type: integer
        tenant_id:
          type: integer
        product_id:
          type: integer
        from_location_type:
          type: string
        from_location_id:
          type: integer
        to_location_type:
          type: string
        to_location_id:
          type: integer
        quantity:
          type: integer
        movement_type:
          type: string
        reference_type:
          type: string
        reference_id:
          type: integer
        notes:
          type: string
        created_at:
          type: string
          format: date-time
    Order:
      type: object
      properties:
        id:
          type: integer
        tenant_id:
          type: integer
        order_number:
          type: string
        customer_id:
          type: integer
        status:
          type: string
          enum: [pending, confirmed, fulfilling, completed, cancelled]
        order_date:
          type: string
          format: date-time
        total_amount:
          type: number
        notes:
          type: string
        items:
          type: array
          items:
            $ref: '#/components/schemas/OrderItem'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    OrderItem:
      type: object
      properties:
        id:
          type: integer
        order_id:
          type: integer
        product_id:
          type: integer
        quantity:
          type: integer
        unit_price:
          type: number
        subtotal:
          type: number
        created_at:
          type: string
          format: date-time
    # ==================== Pricing ====================
    PricingTier:
      type: object
      properties:
        id:
          type: integer
        tenant_id:
          type: integer
        name:
          type: string
        slug:
          type: string
        description:
          type: string
        discount_percentage:
          type: number
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    PricingRule:
      type: object
      properties:
        id:
          type: integer
        tenant_id:
          type: integer
        pricing_tier_id:
          type: integer
        product_id:
          type: integer
        price:
          type: number
        min_quantity:
          type: integer
        max_quantity:
          type: integer
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    PriceCalculation:
      type: object
      properties:
        product_id:
          type: integer
        base_price:
          type: number
        customer_tier:
          type: string
        applied_rules:
          type: array
          items:
            type: object
        final_price:
          type: number
        total:
          type: number
    # ==================== Reports ====================
    RevenueReport:
      type: object
      properties:
        period:
          type: string
        revenue:
          type: number
        orders_count:
          type: integer
        average_order_value:
          type: number
    DashboardMetrics:
      type: object
      properties:
        sales:
          type: object
          properties:
            today_revenue:
              type: number
            month_revenue:
              type: number
            orders_count:
              type: integer
        inventory:
          type: object
          properties:
            total_products:
              type: integer
            low_stock_count:
              type: integer
            out_of_stock_count:
              type: integer
        orders:
          type: object
          properties:
            pending:
              type: integer
            fulfilling:
              type: integer
            completed_today:
              type: integer
    # ==================== Webhooks ====================
    Webhook:
      type: object
      properties:
        id:
          type: integer
        tenant_id:
          type: integer
        name:
          type: string
        url:
          type: string
          format: uri
        secret:
          type: string
        events:
          type: array
          items:
            type: string
        active:
          type: boolean
        content_type:
          type: string
          enum: [json, form-data]
        headers:
          type: object
          additionalProperties:
            type: string
        retry_count:
          type: integer
        timeout:
          type: integer
        last_triggered_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    WebhookDeliveryAttempt:
      type: object
      properties:
        id:
          type: integer
        webhook_id:
          type: integer
        event_type:
          type: string
        url:
          type: string
        attempt_number:
          type: integer
        response_status:
          type: integer
        request_body:
          type: string
        response_body:
          type: string
        error_message:
          type: string
        response_time_ms:
          type: number
        success:
          type: boolean
        next_retry_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
    # ==================== Audit ====================
    AuditLog:
      type: object
      properties:
        id:
          type: integer
        tenant_id:
          type: integer
        user_id:
          type: integer
        event_type:
          type: string
        auditable_type:
          type: string
        auditable_id:
          type: integer
        url:
          type: string
        ip_address:
          type: string
        user_agent:
          type: string
        old_values:
          type: object
        new_values:
          type: object
        metadata:
          type: object
