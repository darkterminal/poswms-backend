; ==========================================
; PHP Custom Configuration
; Production settings for Laravel API
; ==========================================

; Memory and execution
memory_limit = 256M
max_execution_time = 120
max_input_time = 120
max_input_vars = 3000

; File uploads
upload_max_filesize = 100M
post_max_size = 100M

; Error handling
display_errors = Off
log_errors = On
error_log = /var/log/php/error.log
error_reporting = E_ALL
html_errors = Off

; Security
expose_php = Off
allow_url_fopen = On
allow_url_include = Off
disable_functions = passthru,exec,system,chroot,chgrp,chown,shell_exec,proc_open,proc_get_status,ini_alter,ini_restore,dl,pfsockopen,openlog,syslog,readlink,symlink,popepassthru,stream_socket_server,fsocket

; OPcache
opcache.enable = 1
opcache.memory_consumption = 256
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
opcache.revalidate_freq = 60
opcache.fast_shutdown = 1
opcache.enable_cli = 1
opcache.save_comments = 1

; Realpath cache
realpath_cache_size = 4096K
realpath_cache_ttl = 600

; Session
session.save_handler = files
session.save_path = "/var/www/html/storage/framework/sessions"
session.gc_maxlifetime = 7200
session.cookie_httponly = 1
session.cookie_secure = 0
session.use_strict_mode = 1

; Date timezone
date.timezone = UTC

; MySQL settings
mysqli.default_socket = /run/mysqld/mysqld.sock
mysql.default_socket = /run/mysqld/mysqld.sock
pdo_mysql.default_socket = /run/mysqld/mysqld.sock

; SSL
curl.cainfo = /etc/ssl/certs/ca-certificates.crt
openssl.cafile = /etc/ssl/certs/ca-certificates.crt
