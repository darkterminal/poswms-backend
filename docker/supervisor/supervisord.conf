; ==========================================
; Supervisor Configuration
; Manages Nginx and PHP-FPM processes
; ==========================================

[unix_http_server]
file = /dev/shm/supervisor.sock
chmod = 0700

[supervisord]
logfile = /var/log/supervisor/supervisord.log
logfile_maxbytes = 10MB
logfile_backups = 5
loglevel = info
pidfile = /var/run/supervisord.pid
nodaemon = false
silent = false
minfds = 1024
minprocs = 200

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl = unix:///dev/shm/supervisor.sock

; ------------------------------------------
; Nginx Process
; ------------------------------------------
[program:nginx]
command = /usr/sbin/nginx -g "daemon off;"
autostart = true
autorestart = true
stderr_logfile = /var/log/nginx/error.log
stdout_logfile = /var/log/nginx/access.log
user = appuser
priority = 10
numprocs = 1
startretries = 3
stopwaitsecs = 10
stopsignal = QUIT

; ------------------------------------------
; PHP-FPM Process
; ------------------------------------------
[program:php-fpm]
command = /usr/local/sbin/php-fpm --nodaemonize
autostart = true
autorestart = true
stderr_logfile = /var/log/php-fpm/error.log
stdout_logfile = /var/log/php-fpm/access.log
user = appuser
priority = 20
numprocs = 1
startretries = 3
stopwaitsecs = 10
stopsignal = QUIT

; ------------------------------------------
; Queue Worker (Optional - Uncomment to enable)
; ------------------------------------------
; [program:queue-worker]
; command = php /var/www/html/artisan queue:work --tries=3 --timeout=0
; autostart = true
; autorestart = true
; stderr_logfile = /var/log/supervisor/queue-worker-error.log
; stdout_logfile = /var/log/supervisor/queue-worker-access.log
; user = appuser
; priority = 30
; numprocs = 2
; startretries = 3
; stopwaitsecs = 10
; stopsignal = TERM
; process_name = %(program_name)s_%(process_num)02d
